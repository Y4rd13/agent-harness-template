# Scan the commits of a pull request for secrets before they reach main. Git keeps history, so a secret
# that lands is a secret to rotate. False positives: an inline "gitleaks:allow" comment on the line,
# then a fingerprint in .gitleaksignore, then an allowlist in .gitleaks.toml, in that order.
name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  gitleaks:
    name: gitleaks PR scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The binary, pinned by version and checksum: the gitleaks GitHub Action needs a license for
      # organization accounts, the binary does not.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan the pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: gitleaks git --redact --log-opts="${BASE_SHA}..HEAD" .
