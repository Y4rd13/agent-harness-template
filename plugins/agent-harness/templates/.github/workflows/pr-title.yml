# The squash-merged pull request title becomes the commit on main, and the release tool reads its type
# to decide the version bump. A title that is not a Conventional Commit releases nothing or the wrong
# thing, so it is checked before merge.
#
# pull_request_target runs with the base branch's workflow and never checks out the pull request's
# code, so it is safe here: the title is only passed to the action as data.
name: PR title

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
