# One job runs every deterministic gate. Each step runs even when an earlier one failed, so a red run
# lists every failure at once and the author fixes them in one push. One job also pays the runner
# start-up and the dependency install once instead of once per check.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Add the toolchain setup for your stack here, pinned by commit SHA like every other action.

      - name: Install
        id: install
        run: <install command, from the lockfile>

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: <lint command>

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: <format check command>

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: <typecheck command>

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: <test command, the same one CI and humans use>

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: <build command>
